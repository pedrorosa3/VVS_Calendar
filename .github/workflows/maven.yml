name: Calendar CI Pipeline

on:
  push:
    branches: [ "**" ] # Executa em qualquer branch (incluindo a tua)
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # O servidor na nuvem será Linux

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven # Acelera os builds guardando as dependências

    - name: Build and Test with Maven
      # Aqui corre exatamente o mesmo comando que acabaste de correr com sucesso!
      run: mvn clean test